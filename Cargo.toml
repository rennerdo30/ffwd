[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-beta.11"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rennerdo30/ffwd"
homepage = "https://ffwd.renner.dev"
# crates.io only. CI packs and builds every crate on each change (`cargo
# package --workspace`); publishing is the manual publish-crate workflow
# (docs/RELEASING.md, "crates.io").
publish = ["crates-io"]

# The internal crates depend on each other at exactly the workspace version;
# a release bumps these four pins together with `version` above.
# ffwd-render has its own SemVer version, since other projects use it.
[workspace.dependencies]
ffwd-core = { path = "crates/ffwd-core", version = "=0.2.0-beta.11" }
ffwd-render = { path = "crates/ffwd-render", version = "0.1.0" }
ffwd-ai = { path = "crates/ffwd-ai", version = "=0.2.0-beta.11" }
ffwd-update = { path = "crates/ffwd-update", version = "=0.2.0-beta.11" }
ffwd-agent = { path = "crates/ffwd-agent", version = "=0.2.0-beta.11" }

# Fastest iteration (docs/BUILD.md):
# - workspace crates: incremental, small debug info, fast to relink;
# - dependencies: optimised once, no debug info, cached by sccache.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The CPU renderer paints every pixel; unoptimised it would distort every
# interactive check, so it is optimised even in dev builds.
[profile.dev.package.ffwd-render]
opt-level = 2

# Sub-second UI iteration profile: skips PDB / debuginfo emission while keeping
# dependencies and `ffwd-render` optimised.
[profile.dev-ui]
inherits = "dev"
debug = 0

[profile.dev-ui.package."*"]
opt-level = 2
debug = false

[profile.dev-ui.package.ffwd-render]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding stays on: a panicking worker is caught and reported, the window
# survives (AGENTS.md performance rule 7).
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
