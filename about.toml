# cargo-about: THIRD-PARTY-NOTICES.txt for release packages (release.yml).
# Keep in step with deny.toml; a dependency under any other licence fails.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# ffwd's own crates are covered by LICENSE.
private = { ignore = true }
