[package]
name = "ffwd-agent"
description = "Experimental agent workspaces for ffwd: runs a coding agent in its own worktree and sandbox. No UI dependencies. Internal to ffwd: no stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
include = ["src/**/*.rs", "LICENSE"]

[dependencies]
ffwd-core.workspace = true

# The terminal window of a terminal session (FF-23): CreateProcessW with a
# new console and no inherited handles.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
