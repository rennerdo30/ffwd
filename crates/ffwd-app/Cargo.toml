[package]
name = "ffwd"
description = "ffwd: a fast, keyboard-first Git client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ffwd"
path = "src/main.rs"

[dependencies]
ffwd-core = { path = "../ffwd-core" }
ffwd-agent = { path = "../ffwd-agent" }
ffwd-render = { path = "../ffwd-render" }
winit = "0.30.13"
softbuffer = "0.4.8"
raw-window-handle = "0.6.2"
png = "0.18.1"
jpeg-decoder = { version = "0.3.2", default-features = false }
ffwd-update = { path = "../ffwd-update" }
ffwd-ai = { path = "../ffwd-ai" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
jpeg-encoder = "0.6.1"
