[package]
name = "ffwd-ai"
description = "AI help for ffwd against an OpenAI-compatible endpoint the user configures (local servers first). Streaming, cancellable, no UI dependencies. Internal to ffwd: no stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
include = ["src/**/*.rs", "LICENSE"]

[dependencies]
# Already in the build through ffwd-update: no new crates.
serde_json = "1.0.154"
