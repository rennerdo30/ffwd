[package]
name = "ffwd-core"
description = "Repository model for ffwd: history streaming, refs, graph lanes, diffs. No UI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

# Job objects end a cancelled git with every helper it started (ssh,
# remote helpers). Already in the build through ffwd-app: no new crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
