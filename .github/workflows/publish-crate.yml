name: publish-crate

# Publishes the six workspace crates of one released version to crates.io,
# so `cargo install ffwd` works. Manual only, and only for a version tag on
# main whose GitHub release the owner has already published
# (docs/RELEASING.md, "crates.io"). The token exists only in the last step
# of the `publish` job, behind the `crates-io` environment; everything before
# it runs without one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published version tag to put on crates.io (vX.Y.Z or vX.Y.Z-pre.N)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Check the tag and package (no token)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version tag on main, matches the workspace version and is released
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a version tag: $RELEASE_TAG"; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "$RELEASE_TAG ($sha) is not on main"; exit 1; }
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ "$RELEASE_TAG" = "v$version" ] || { echo "Tag $RELEASE_TAG does not match the workspace version $version"; exit 1; }
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = "false" ] || { echo "The GitHub release $RELEASE_TAG is not published yet"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Every crate carries the root LICENSE unchanged
        run: for c in crates/*/; do cmp LICENSE "${c}LICENSE"; done
      - name: Package and build from the packed sources
        run: cargo package --workspace --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # The same commit `verify` packaged and built; cargo publishes the
      # crates in dependency order and waits for each to reach the index.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --no-verify
