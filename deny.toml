# cargo-deny configuration. ffwd ships only permissively licensed
# dependencies; CI enforces this list (AGENTS.md).
# For "A OR B" expressions one allowed side is enough.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
